services:
  # ================================================================
  # FastAPI Application
  # ================================================================
  app:
    image: backend-app:optimized
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: health-rag-app
    env_file:
      - ./config/.env
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=info
    volumes:
      - ./config:/app/config:ro
      - app_logs:/app/logs
      - app_data:/app/data
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - health-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================================================
  # Qdrant Vector Database
  # ================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: health-rag-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - health-rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  app_data:
    driver: local

  app_logs:
    driver: local

  qdrant_storage:
    driver: local

  qdrant_snapshots:
    driver: local

  huggingface_cache:
    driver: local

networks:
  health-rag-network:
    driver: bridge
