name: Deploy with Cached Assets

on:
  workflow_run:
    workflows: [Build & Cache Transformers Model]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/health-rag-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download cached embeddings
        uses: actions/download-artifact@v3
        with:
          name: embeddings-cache
          path: ./Backend/data

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest cached image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Verify image
        run: |
          echo "Image pulled successfully with pre-cached models"
          docker inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest | grep -i "Size"

      # Add your deployment steps here
      # Example:
      # - name: Deploy to production
      #   run: |
      #     # Your deployment commands
      #     echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
