# ──────────────────────────────────────────────────────────────────────────────
# CI/CD Pipeline – Lint → Test → Build & Push to ECR → Deploy to EC2
# ──────────────────────────────────────────────────────────────────────────────
name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: mental-health-chatbot

jobs:
  # ── Stage 1: Linting with Ruff (matches pre-commit config) ──────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff==0.4.10

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  # ── Stage 2: Unit Tests ─────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyTorch (CPU-only)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest test.py -v

  # ── Stage 3: Build Docker Image & Push to Amazon ECR ────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 4: Deploy to EC2 (only if lint + test + build pass) ───────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get ECR Login Password
        id: ecr-password
        run: echo "password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})" >> $GITHUB_OUTPUT

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          ECR_PASSWORD: ${{ steps.ecr-password.outputs.password }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCESS_KEY_ID && format('{0}.dkr.ecr.{1}.amazonaws.com', '559947224993', secrets.AWS_REGION) }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_PASSWORD,ECR_REGISTRY,ECR_REPOSITORY
          script: |
            # 1. Login to Amazon ECR
            echo $ECR_PASSWORD | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 2. Pull the latest image
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # 3. Create docker-compose.prod.yml on the server
            cat > ~/docker-compose.prod.yml << 'COMPOSE_EOF'
            services:
              api:
                image: ECR_IMAGE_PLACEHOLDER
                ports:
                  - "8000:8000"
                env_file:
                  - .env
                environment:
                  - REDIS_URL=redis://redis:6379/0
                depends_on:
                  - redis
                restart: unless-stopped
                networks:
                  - app-network

              redis:
                image: redis:7-alpine
                ports:
                  - "6379:6379"
                volumes:
                  - redis_data:/data
                restart: unless-stopped
                networks:
                  - app-network

            volumes:
              redis_data:

            networks:
              app-network:
                driver: bridge
            COMPOSE_EOF

            # 4. Replace the image placeholder with the actual ECR image URI
            sed -i "s|ECR_IMAGE_PLACEHOLDER|$ECR_REGISTRY/$ECR_REPOSITORY:latest|g" ~/docker-compose.prod.yml

            # 5. Stop old containers and start new ones
            cd ~
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d

            # 6. Clean up old unused images to save disk space
            docker image prune -f
