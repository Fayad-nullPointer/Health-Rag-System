name: Build & Cache Transformers Model

on:
  push:
    branches: [main, develop]
    paths:
      - 'Backend/Dockerfile'
      - 'Backend/pyproject.toml'
      - 'Backend/app/**'
      - 'Backend/rag/**'
      - 'Backend/classifier/**'
      - '.github/workflows/build-cache.yml'
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly rebuild to refresh cache
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/health-rag-backend

jobs:
  build-and-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build with cache - model is cached in the builder stage
      - name: Build Docker image with cached models
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=health-rag-backend
          cache-to: type=gha,mode=max,scope=health-rag-backend
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push to registry (with caching)
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=health-rag-backend
          cache-to: type=gha,mode=max,scope=health-rag-backend

      - name: Cache embeddings artifact
        uses: actions/upload-artifact@v3
        with:
          name: embeddings-cache
          path: Backend/data/embeddings.npy
          retention-days: 30

  # Optional: Verify the image runs without model download delays
  verify-startup:
    runs-on: ubuntu-latest
    needs: build-and-cache
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test image locally
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          load: true
          tags: health-rag:test
          cache-from: type=gha,scope=health-rag-backend

      - name: Verify image layers
        run: |
          echo "Docker image built successfully with cached layers"
          docker images health-rag:test
